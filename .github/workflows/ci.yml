name: CI

on: [pull_request]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: '0'
    - uses: astral-sh/setup-uv@v8.3.2
    - name: Check commit messages
      run: |
        for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
          git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
          uvx pre-commit run conventional-pre-commit \
            --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/msg"
        done

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v8.3.2
      with:
        enable-cache: true
    - run: uv run pytest --cov=fcmeans

  linter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v8.3.2
      with:
        enable-cache: true
    - run: |
        uv run black . --line-length=79 --check
        uv run isort . -c
        uv run flake8 --exclude ".*"
